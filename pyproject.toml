[project]
name = "browseract-dify-plugin"
version = "1.0.0"
description = "BrowserAct tools for Dify"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dify-plugin==0.10.2",
    "jsonschema>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:anyio"
